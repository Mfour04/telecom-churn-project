project:
  name: "Telco Customer Churn Prediction"
  version: "1.0.0"

paths:
  raw_data: "data/raw/Telco-Customer-Churn.csv"
  processed_data: "data/processed/"
  model_dir: "models/"
  mlflow_tracking_uri: "mlruns"

data:
  target_column: "Churn"
  id_column: "customerID"
  test_size: 0.2
  random_state: 42

  categorical_features:
    - gender
    - Partner
    - Dependents
    - PhoneService
    - MultipleLines
    - InternetService
    - OnlineSecurity
    - OnlineBackup
    - DeviceProtection
    - TechSupport
    - StreamingTV
    - StreamingMovies
    - Contract
    - PaperlessBilling
    - PaymentMethod

  numerical_features:
    - SeniorCitizen
    - tenure
    - MonthlyCharges
    - TotalCharges

model:
  experiment_name: "churn_prediction"
  run_name: "xgboost_baseline"

  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "logloss"
    random_state: 42
    scale_pos_weight: 2.5   # handle class imbalance

  logistic_regression:
    C: 1.0
    max_iter: 1000
    random_state: 42

  random_forest:
    n_estimators: 200
    max_depth: 8
    random_state: 42

api:
  host: "0.0.0.0"
  port: 8000
  workers: 1
  model_path: "models/best_model.pkl"
  preprocessor_path: "models/preprocessor.pkl"
  thresholds_path: "models/feature_thresholds.yaml"

feature_thresholds:
  monthly_charges_median: null  

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "churn_prediction"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

tuning: 
  n_iter: 15 
  cv_folds: 5
  scoring: "roc_auc"
  random_state: 42
  # Int params -> scipy randint(low, high): samples [low, high).
  # Float params -> scipy uniform(loc, scale): samples [loc, loc + scale].
  # Checked: every [a, b] pair below is valid as (loc, scale) / (low, high).

  xgboost:
    n_estimators: [100, 500]
    max_depth: [3, 9]
    learning_rate: [0.01, 0.19]
    subsample: [0.6, 0.4]
    colsample_bytree: [0.6, 0.4]
    min_child_weight: [1, 10]

  logistic_regression:
    C: [0.01, 9.99]
    solver: ["liblinear", "lbfgs", "saga"]
    penalty: ["l2"]

  random_forest:
    n_estimators: [100, 400]
    max_depth: [4, 12]
    min_samples_split: [2, 10]
    min_samples_leaf: [1, 5]
    max_features: ["sqrt", "log2"]